[package]
name = "interpreter-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["operator"]
operator = []
portable = []

[dependencies]
leptos = { version = "=0.8.23", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tw_merge = "=0.1.22"
web-sys = { version = "=0.3.107", features = [
    "Document", "Window", "Element", "Event", "EventTarget", "HtmlElement",
    "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement",
] }

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
strip = "debuginfo"
panic = "abort"
