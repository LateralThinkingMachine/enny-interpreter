[workspace]
members = ["services/call-pilot"]
resolver = "3"
exclude = ["crates/adapters/vendor/libfvad-sys"]

[patch.crates-io]
libfvad-sys = { path = "crates/adapters/vendor/libfvad-sys" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
sha2 = "=0.11.0"
getrandom = "=0.4.3"
base64 = "=0.22.1"
libc = "=0.2.189"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink", "async-await"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
